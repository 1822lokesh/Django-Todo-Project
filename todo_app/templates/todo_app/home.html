<!DOCTYPE html>
<html>
<head>
    <title>Django To-Do</title>
</head>
<body>
    <h1>My To-Do List</h1>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="task" placeholder="New Task...">
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li>
                {{ task.title }} 
                <a href="{% url 'delete_task' task.id %}">[Delete]</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
